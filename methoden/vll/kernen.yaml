# Veilig Leren Lezen (KIM-versie): letters en woorden per kern.
# Overgenomen van de gratis doelkaarten van jufbijtje.nl (KIM versie 2020);
# bronnen in methoden/vll/README.md.
# Kern 7 t/m 11 hebben geen nieuwe letters meer; daar staan bij `letters`
# de nieuwe klanken (kern 7) of niets.
#
# letters  : de nieuwe letters van de kern
# woordjes : de woorden met plaatje op de doelkaart
# oefen    : de woorden van "ik oefen", per rij zoals op de kaart

start:
  letters: [i, k, m, s]
  woordjes: [ik, kim, sim]
  oefen: [ik, mis, kim, mik, sis, kik, sik, sim, is]

